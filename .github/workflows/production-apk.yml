# Signed release APK for every push to `production`.
#
# Repo Settings → Secrets and variables → Actions — add these three (do not commit them):
#   SIGN_KEY_BASE64  base64 of tapfeet-release.jks  (Linux: base64 -w0 file.jks)
#   SIGN_KEY_PWD     keystore / key password
#   SIGN_KEY_ALIAS   tapfeet
#
# Settings → Actions → General → Workflow permissions: Read and write
# (needed to create the versioned GitHub Release, e.g. v1.0.16).
#
# Version tag comes from the last `# vX.Y.Z` heading in docs/更新内容.txt.
# Rebuilding the same version updates that release's APK; bumping the heading
# creates a new release and leaves older ones in place.

name: Production APK

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: production-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Require signing secrets
        env:
          SIGN_KEY_BASE64: ${{ secrets.SIGN_KEY_BASE64 }}
          SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
        run: |
          missing=0
          for n in SIGN_KEY_BASE64 SIGN_KEY_PWD SIGN_KEY_ALIAS; do
            if [ -z "${!n}" ]; then
              echo "::error::$n is empty. Add it under Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          exit "$missing"

      - name: Fetch source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read version from changelog
        id: ver
        run: |
          python3 <<'PY'
          import os
          import pathlib
          import re
          import sys

          text = pathlib.Path("docs/更新内容.txt").read_text(encoding="utf-8")
          heading = re.compile(
              r"^#\s*(?:更新内容\s*)?[vV]?(\d+(?:\.\d+){1,3}(?:-\d+)?)\s*$",
              re.M,
          )
          matches = list(heading.finditer(text))
          if not matches:
              sys.exit("no # vX.Y.Z heading in docs/更新内容.txt")
          last = matches[-1]
          raw = last.group(1)
          version = raw if raw.startswith("v") else f"v{raw}"
          notes = []
          for line in text[last.end():].splitlines():
              s = line.strip()
              if not s:
                  continue
              if s.startswith("#"):
                  break
              notes.append(s)
          pathlib.Path("release-notes.md").write_text(
              "\n".join(notes) + ("\n" if notes else ""),
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
          print(f"release version={version}")
          PY

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y extra-cmake-modules gettext ninja-build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v3
        with:
          packages: cmake;3.31.6

      - name: Install NDK and build-tools
        run: |
          sdkmanager --install "ndk;28.0.13004108" "build-tools;36.1.0" "platforms;android-36"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build signed release APK
        env:
          SIGN_KEY_BASE64: ${{ secrets.SIGN_KEY_BASE64 }}
          SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
        run: |
          sed -i 's/-Xmx2048m/-Xmx4096m/' gradle.properties
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs --verbose "$apk"

      - name: Name APK for the version tag
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          dest="app/build/outputs/apk/release/tapfeet.ime-${version}.apk"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "no APK in app/build/outputs/apk/release" >&2
            exit 1
          fi
          if [ ! -f "$dest" ]; then
            cp -f "${apks[0]}" "$dest"
          fi
          ls -l "$dest"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: tapfeet-${{ steps.ver.outputs.version }}
          path: app/build/outputs/apk/release/tapfeet.ime-${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error

      - name: Append build footer to release notes
        run: |
          {
            echo
            echo "---"
            echo "Signed APK from \`production\` @ \`${{ github.sha }}\`."
            echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> release-notes.md

      - name: Publish versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: TapFeet ${{ steps.ver.outputs.version }}
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/tapfeet.ime-${{ steps.ver.outputs.version }}.apk
          body_path: release-notes.md

      - name: Remove rolling ci-production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete ci-production --yes --cleanup-tag || true
